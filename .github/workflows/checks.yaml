name: Checks

on: [push, pull_request]

jobs:
  checks:
    name: Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Format checks
        run: cargo fmt -- --check
      - name: Idiomatic checks
        run: cargo clippy -- -D warnings
